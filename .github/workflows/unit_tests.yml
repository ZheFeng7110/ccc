name: Unit Tests

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CPM cache dir
        run: |
          mkdir -p ~/.cpm_cache
          echo "CPM_SOURCE_CACHE=$HOME/.cpm_cache" >> "$GITHUB_ENV"

      - name: Restore CPM cache
        uses: actions/cache@v4
        with:
          path: ~/.cpm_cache
          key: cpm-linux-${{ hashFiles('test/get_cpm.cmake') }}
          restore-keys: cpm-linux-

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build g++-15 clang-14 libc++-14-dev libc++abi-14-dev

      - name: Test — GCC 15
        shell: pwsh
        run: ./scripts/Run-UnitTest.ps1 -Toolchains gcc -CcOverride gcc-15 -CxxOverride g++-15

      - name: Test — Clang 14 (libc++)
        shell: pwsh
        run: ./scripts/Run-UnitTest.ps1 -Toolchains clang -CcOverride clang-14 -CxxOverride clang++-14

  macos:
    name: macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CPM cache dir
        run: |
          mkdir -p ~/.cpm_cache
          echo "CPM_SOURCE_CACHE=$HOME/.cpm_cache" >> "$GITHUB_ENV"

      - name: Restore CPM cache
        uses: actions/cache@v4
        with:
          path: ~/.cpm_cache
          key: cpm-macos-${{ hashFiles('test/get_cpm.cmake') }}
          restore-keys: cpm-macos-

      - name: Install build tools
        run: |
          brew install ninja gcc@15

      - name: Test — GCC 15
        shell: pwsh
        run: ./scripts/Run-UnitTest.ps1 -Toolchains gcc -CcOverride gcc-15 -CxxOverride g++-15

      - name: Test — Apple Clang (libc++)
        shell: pwsh
        run: ./scripts/Run-UnitTest.ps1 -Toolchains clang -CcOverride clang -CxxOverride clang++

  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CPM cache dir
        shell: bash
        run: |
          mkdir -p ~/.cpm_cache
          echo "CPM_SOURCE_CACHE=$HOME/.cpm_cache" >> "$GITHUB_ENV"

      - name: Restore CPM cache
        uses: actions/cache@v4
        with:
          path: ~/.cpm_cache
          key: cpm-windows-${{ hashFiles('test/get_cpm.cmake') }}
          restore-keys: cpm-windows-

      - name: Test — MSVC (VS 2022)
        shell: pwsh
        run: ./scripts/Run-UnitTest.ps1
