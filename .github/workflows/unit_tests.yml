name: Unit Tests

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / GCC 16
            os: ubuntu-latest
            toolchain: gcc
          - name: Linux / LLVM 22 (libc++)
            os: ubuntu-latest
            toolchain: llvm
          - name: macOS / LLVM 22 (libc++)
            os: macos-latest
            toolchain: llvm
          - name: Windows / MSVC (VS 2026)
            os: windows-latest
            toolchain: msvc

    env:
      XLINGS_NON_INTERACTIVE: '1'
      XLINGS_RELEASE_MIRROR: GLOBAL

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC developer environment
        if: matrix.toolchain == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build

      - name: Install build tools
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install xlings
        if: matrix.toolchain != 'msvc'
        run: |
          curl -fsSL https://d2learn.org/xlings-install.sh | bash
          XLINGS="$HOME/.xlings/subos/current/bin"
          export PATH="$XLINGS:$HOME/.xlings/bin:$PATH"
          xlings config --mirror GLOBAL
          xlings update
          echo "$XLINGS" >> "$GITHUB_PATH"
          echo "$HOME/.xlings/bin" >> "$GITHUB_PATH"

      - name: Install GCC toolchain
        if: matrix.toolchain == 'gcc'
        run: |
          # CMake >= 4.4 is required: consuming installed C++ module targets
          # needs the synthetic BMI targets to adopt the consumer's compile
          # features (fixed in 4.4; 3.x builds BMIs with the provider's
          # standard, which breaks GCC consumers using a newer dialect).
          xlings install cmake@4.4.2 -y -g
          xlings install gcc@16.1.0 -y -g

      - name: Install LLVM toolchain
        if: matrix.toolchain == 'llvm'
        run: |
          # Same CMake floor as above.
          xlings install cmake@4.4.2 -y -g
          xlings install llvm@22.1.8 -y -g

      - name: Configure libc++ flags
        if: matrix.toolchain == 'llvm'
        shell: pwsh
        run: |
          # clang-scan-deps (used by CMake for C++20+ module scanning) does
          # not reproduce the clang driver's SDK and libc++ include path
          # inference, so pass both paths explicitly. CMake forwards
          # CMAKE_CXX_FLAGS, initialized from CXXFLAGS, to the scanner.
          $flags = "-stdlib=libc++ -Wno-unused-command-line-argument"
          if ($IsMacOS) {
              $sdk = & xcrun --show-sdk-path
              if ($LASTEXITCODE -eq 0 -and $sdk) {
                  $flags += " -isysroot $sdk"
              }
          }
          $includeDir = & clang++ --print-file-name=include/c++/v1
          if ($LASTEXITCODE -eq 0 -and $includeDir -and
              [System.IO.Path]::IsPathRooted($includeDir) -and
              (Test-Path -LiteralPath $includeDir)) {
              $resolved = (Resolve-Path -LiteralPath $includeDir).Path
              $flags += " -isystem $resolved"
              # LLVM also installs generated headers (__config_site et al)
              # in include/<target-triple>/c++/v1; clang-scan-deps searches
              # neither directory on its own.
              $includeRoot = Split-Path -Parent (Split-Path -Parent $resolved)
              Get-ChildItem -LiteralPath $includeRoot -Directory -ErrorAction SilentlyContinue |
                  ForEach-Object {
                      $targetDir = Join-Path $_.FullName "c++/v1"
                      if (Test-Path -LiteralPath $targetDir) {
                          $flags += " -isystem $targetDir"
                      }
                  }
          }
          Add-Content -Path $env:GITHUB_ENV -Value "CXXFLAGS=$flags"
          Write-Host "CXXFLAGS=$flags"

      - name: Unit tests (C++11-23)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $standards = @("11", "14", "17", "20", "23")
          $generator = if ($IsWindows) { "Visual Studio 18 2026" } else { "Ninja" }

          foreach ($std in $standards) {
              $configs = @(@{ Directory = "build-unit/cpp$std"; Modules = $false })
              if ([int]$std -ge 20) {
                  $configs += @{ Directory = "build-unit/cpp$std/modules"; Modules = $true }
              }

              foreach ($config in $configs) {
                  $label = "C++$std"
                  if ($config.Modules) {
                      $label += " (modules)"
                  }
                  Write-Host "===== $label ====="

                  $configureArgs = @(
                      "-G", $generator,
                      "-S", ".",
                      "-B", $config.Directory,
                      "-DCMAKE_BUILD_TYPE=Release",
                      "-DCCC_BUILD_TESTS=ON",
                      "-DCCC_TEST_CPP_STANDARD=$std"
                  )
                  if ($IsWindows) {
                      $configureArgs += @("-A", "x64")
                  }
                  if ($config.Modules) {
                      $configureArgs += "-DCCC_USE_CPP_MODULES=ON"
                  }

                  & cmake @configureArgs
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

                  & cmake --build $config.Directory --config Release
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

                  & ctest --test-dir $config.Directory -C Release --output-on-failure
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              }
          }

      - name: Install tests (C++11-23)
        shell: pwsh
        run: ./scripts/Run-InstallTest.ps1 -Verbose
