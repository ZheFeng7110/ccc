name: Unit Tests

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  linux-cache-gcc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ZheFeng7110/linux-build-gcc@develop
        with:
          gcc-version: 16.1.0

  linux:
    name: Linux
    runs-on: ubuntu-latest
    needs: linux-cache-gcc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CPM cache dir
        run: |
          mkdir -p ~/.cpm_cache
          echo "CPM_SOURCE_CACHE=~/.cpm_cache" >> "$GITHUB_ENV"

      - name: Restore CPM cache
        uses: actions/cache@v4
        with:
          path: ~/.cpm_cache
          key: cpm-linux-${{ hashFiles('test/get_cpm.cmake') }}
          restore-keys: cpm-linux-

      - name: Load GCC 16 from cache
        uses: ZheFeng7110/linux-build-gcc/restore-cache@develop
        with:
          gcc-version: 16.1.0

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build clang-19 clang-tools-19 libc++-19-dev libc++abi-19-dev wget xz-utils

      - name: Test — GCC 16
        shell: pwsh
        run: ./scripts/Run-UnitTest.ps1 -Toolchains gcc -CcOverride ~/.local/gcc-16.1.0/bin/gcc -CxxOverride ~/.local/gcc-16.1.0/bin/g++

      - name: Test — Clang 19 (libc++)
        shell: pwsh
        run: ./scripts/Run-UnitTest.ps1 -Toolchains clang -CcOverride clang-19 -CxxOverride clang++-19

  macos:
    name: macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CPM cache dir
        run: |
          mkdir -p ~/.cpm_cache
          echo "CPM_SOURCE_CACHE=~/.cpm_cache" >> "$GITHUB_ENV"

      - name: Restore CPM cache
        uses: actions/cache@v4
        with:
          path: ~/.cpm_cache
          key: cpm-macos-${{ hashFiles('test/get_cpm.cmake') }}
          restore-keys: cpm-macos-

      - name: Install build tools
        run: |
          brew install ninja gcc@15

      - name: Test — GCC 15
        shell: pwsh
        run: ./scripts/Run-UnitTest.ps1 -Toolchains gcc -CcOverride gcc-15 -CxxOverride g++-15

      - name: Test — Apple Clang (libc++)
        shell: pwsh
        run: ./scripts/Run-UnitTest.ps1 -Toolchains clang -CcOverride clang -CxxOverride clang++

  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CPM cache dir
        shell: bash
        run: |
          mkdir -p ~/.cpm_cache
          echo "CPM_SOURCE_CACHE=~/.cpm_cache" >> "$GITHUB_ENV"

      - name: Restore CPM cache
        uses: actions/cache@v4
        with:
          path: ~/.cpm_cache
          key: cpm-windows-${{ hashFiles('test/get_cpm.cmake') }}
          restore-keys: cpm-windows-

      - name: Test — MSVC (VS 2026)
        shell: pwsh
        run: ./scripts/Run-UnitTest.ps1
