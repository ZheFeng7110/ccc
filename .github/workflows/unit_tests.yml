name: Unit Tests

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CPM cache dir
        run: |
          mkdir -p ~/.cpm_cache
          echo "CPM_SOURCE_CACHE=~/.cpm_cache" >> "$GITHUB_ENV"

      - name: Restore CPM cache
        uses: actions/cache@v4
        with:
          path: ~/.cpm_cache
          key: cpm-linux-${{ hashFiles('test/get_cpm.cmake') }}
          restore-keys: cpm-linux-

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build

      - name: Install toolchains via xlings
        env:
          XLINGS_NON_INTERACTIVE: '1'
          XLINGS_RELEASE_MIRROR: GLOBAL
        run: |
          curl -fsSL https://d2learn.org/xlings-install.sh | bash
          XLINGS="$HOME/.xlings/subos/current/bin"
          export PATH="$XLINGS:$HOME/.xlings/bin:$PATH"
          xlings config --mirror GLOBAL
          xlings update
          xlings install gcc@16.1.0 -y -g
          xlings install llvm@22.1.8 -y -g
          echo "$XLINGS" >> "$GITHUB_PATH"
          echo "$HOME/.xlings/bin" >> "$GITHUB_PATH"

      - name: Test — GCC 16
        shell: pwsh
        run: ./scripts/Run-UnitTest.ps1 -Verbose -CcOverride gcc -CxxOverride g++

      - name: Test — Clang 22 (libc++)
        shell: pwsh
        run: ./scripts/Run-UnitTest.ps1 -Verbose -UseLibCXX -CcOverride clang -CxxOverride clang++

      - name: Install Test — GCC 16
        shell: pwsh
        run: ./scripts/Run-InstallTest.ps1 -Verbose -CcOverride gcc -CxxOverride g++

      - name: Install Test — Clang 22 (libc++)
        shell: pwsh
        run: ./scripts/Run-InstallTest.ps1 -Verbose -UseLibCXX -CcOverride clang -CxxOverride clang++

  macos:
    name: macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CPM cache dir
        run: |
          mkdir -p ~/.cpm_cache
          echo "CPM_SOURCE_CACHE=~/.cpm_cache" >> "$GITHUB_ENV"

      - name: Restore CPM cache
        uses: actions/cache@v4
        with:
          path: ~/.cpm_cache
          key: cpm-macos-${{ hashFiles('test/get_cpm.cmake') }}
          restore-keys: cpm-macos-

      - name: Install build tools
        run: |
          brew install ninja

      - name: Install toolchains via xlings
        env:
          XLINGS_NON_INTERACTIVE: '1'
          XLINGS_RELEASE_MIRROR: GLOBAL
        run: |
          curl -fsSL https://d2learn.org/xlings-install.sh | bash
          XLINGS="$HOME/.xlings/subos/current/bin"
          export PATH="$XLINGS:$HOME/.xlings/bin:$PATH"
          xlings config --mirror GLOBAL
          xlings update
          xlings install llvm@22.1.8 -y -g
          echo "$XLINGS" >> "$GITHUB_PATH"
          echo "$HOME/.xlings/bin" >> "$GITHUB_PATH"

      - name: Test — LLVM Clang 22 (libc++)
        shell: pwsh
        run: ./scripts/Run-UnitTest.ps1 -Verbose -UseLibCXX -CcOverride clang -CxxOverride clang++

      - name: Test — Apple Clang (libc++)
        shell: pwsh
        run: ./scripts/Run-UnitTest.ps1 -Verbose -UseLibCXX -CcOverride /usr/bin/clang -CxxOverride /usr/bin/clang++

      - name: Install Test — LLVM Clang 22 (libc++)
        shell: pwsh
        run: ./scripts/Run-InstallTest.ps1 -Verbose -UseLibCXX -CcOverride clang -CxxOverride clang++

      - name: Install Test — Apple Clang (libc++)
        shell: pwsh
        run: ./scripts/Run-InstallTest.ps1 -Verbose -UseLibCXX -CcOverride /usr/bin/clang -CxxOverride /usr/bin/clang++

  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Create CPM cache dir
        shell: bash
        run: |
          mkdir -p ~/.cpm_cache
          echo "CPM_SOURCE_CACHE=$HOME/.cpm_cache" >> "$GITHUB_ENV"

      - name: Restore CPM cache
        uses: actions/cache@v4
        with:
          path: ~/.cpm_cache
          key: cpm-windows-${{ hashFiles('test/get_cpm.cmake') }}
          restore-keys: cpm-windows-

      - name: Test — MSVC (VS 2026)
        shell: pwsh
        run: ./scripts/Run-UnitTest.ps1 -Verbose

      - name: Install Test — MSVC (VS 2026)
        shell: pwsh
        run: ./scripts/Run-InstallTest.ps1 -Verbose -CcOverride cl -CxxOverride cl
