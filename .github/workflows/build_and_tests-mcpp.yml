name: Build and Tests (mcpp)

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            install: |
              curl -fsSL https://github.com/mcpp-community/mcpp/releases/latest/download/install.sh | bash
              echo "$HOME/.mcpp/bin" >> "$GITHUB_PATH"
          - name: macOS
            os: macos-latest
            install: |
              curl -fsSL https://github.com/mcpp-community/mcpp/releases/latest/download/install.sh | bash
              echo "$HOME/.mcpp/bin" >> "$GITHUB_PATH"
          - name: Windows
            os: windows-latest
            install: |
              $prefix = "$env:USERPROFILE\.mcpp"
              $zip = "$env:TEMP\mcpp.zip"
              Invoke-WebRequest -Uri "https://github.com/mcpp-community/mcpp/releases/latest/download/mcpp-windows-x86_64.zip" -OutFile $zip
              Expand-Archive -Path $zip -DestinationPath "$env:TEMP\mcpp-extract" -Force
              $extracted = Get-ChildItem -Path "$env:TEMP\mcpp-extract" -Directory | Select-Object -First 1
              if (-not $extracted) { throw "mcpp zip did not contain a top-level directory" }
              New-Item -ItemType Directory -Force -Path $prefix | Out-Null
              Copy-Item -Path "$($extracted.FullName)\*" -Destination $prefix -Recurse -Force
              Add-Content -Path $env:GITHUB_PATH -Value "$prefix\bin"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache mcpp toolchains
        uses: actions/cache@v6
        with:
          path: ~/.mcpp
          key: mcpp-${{ matrix.os }}-${{ hashFiles('mcpp.toml', 'test/mcpp.toml') }}
          restore-keys: mcpp-${{ matrix.os }}-

      - name: Install mcpp
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ${{ matrix.install }}

      - name: Install mcpp
        if: matrix.os != 'windows-latest'
        shell: bash
        run: ${{ matrix.install }}

      - name: Build and test
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          mcpp --version
          mcpp build -p test --verbose
          mcpp run -p test

      - name: Build and test
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          mcpp --version
          mcpp build -p test --verbose
          mcpp run -p test

      - name: Set up Python for assertion scenarios
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Tagged assertion scenarios
        shell: pwsh
        run: |
          python3 test/tassert/run_projects.py --tool mcpp --fail-fast
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload assertion scenario logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tassert-mcpp-${{ matrix.os }}
          path: build-tassert/**/scenario.log
