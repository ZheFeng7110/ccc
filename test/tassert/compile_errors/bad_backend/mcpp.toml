[workspace]
members = []

[package]
name = "test"
version = "0.0.0"
standard = "c++20"

[build]
sources = ["main.cc"]
dialect_cxxflags = ["-DCCC_TASSERT_FORMAT_BACKEND=9"]
defines = ["TEST_FORMAT=1", "TEST_FORMAT_BACKEND=9"]

[targets.test]
kind = "bin"
main = "main.cc"

[dependencies]
ccc = { path = "../../../../" }
