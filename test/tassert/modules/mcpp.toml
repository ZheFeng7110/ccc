[workspace]
members = []

[package]
name = "test"
version = "0.0.0"
standard = "c++20"

[build]
sources = ["main.cc", "helper.cc"]
dialect_cxxflags = ["-DCCC_TASSERT_FORMAT_BACKEND=0", "-DCCC_TASSERT_CONFIG_HEADER=\\\"../../../test/tassert/config.hh\\\""]
defines = ["TEST_IMPORT_TASSERT=1"]

[targets.test]
kind = "bin"
main = "main.cc"

[dependencies]
ccc = { path = "../../../" }

[scan_overrides."main.cc"]
imports = ["ccc.tassert"]

[scan_overrides."helper.cc"]
imports = ["ccc.tassert"]
